apis:
- aid: huma:huma-integration-api
  name: Huma Integration API
  description: >-
    Huma's backend Integration API for embedding Huma platform functionality into
    first-party applications. Authentication uses a Workspace-issued huma-config.json
    (client-credentials style) consumed by the Huma API client; a backend service
    exchanges its own authenticated user for a Huma token via login/register, then
    calls Huma backend methods. Access is gated behind a Huma Workspace account. No
    public HL7 FHIR CapabilityStatement or downloadable OpenAPI is published.
  humanURL: https://docs.huma.com/api-integration/intro
  baseURL: https://workspace-gcp-uk.api.huma.com/api/integration/v1
  tags:
  - Healthcare
  - Integration
  - Remote Patient Monitoring
  properties:
  - type: Documentation
    url: https://docs.huma.com/api-integration/intro
  - type: GettingStarted
    url: https://docs.huma.com/quick-start/backend/
  - type: Authentication
    url: https://docs.huma.com/quick-start/backend/
- aid: huma:huma-mobile-sdk
  name: Huma Mobile & Web SDK
  description: >-
    Huma's software development kits for building or enhancing applications with
    out-of-the-box Huma functionality across iOS, Android, and Angular, covering
    authentication/authorization, connected Device Kit, charts, questionnaires,
    modules, messaging, call kit, and object storage. Distributed as versioned SDK
    packages documented on the Huma developer portal.
  humanURL: https://docs.huma.com/sdk/next/intro
  tags:
  - SDK
  - Healthcare
  - Mobile
  properties:
  - type: Documentation
    url: https://docs.huma.com/sdk/next/intro
  - type: GettingStarted
    url: https://docs.huma.com/quick-start/intro
