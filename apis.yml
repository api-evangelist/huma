aid: huma
url: https://raw.githubusercontent.com/api-evangelist/huma/refs/heads/main/apis.yml
name: Huma
kind: company
description: >-
  Huma (Huma Therapeutics Limited) is a United Kingdom-headquartered digital health
  and remote patient monitoring company that provides a regulated, configurable
  platform for building and running healthcare and life-sciences applications. Its
  Huma Workspace lets clinical teams assemble no-code apps, connected-device data
  capture, ePRO questionnaires, algorithm-based assessments, and a clinician portal
  for telemedicine and remote monitoring, while its developer surface exposes a
  backend Integration API and native iOS, Android, and Angular SDKs for embedding
  Huma functionality into first-party applications. Huma operates as CE-marked /
  MDR Class IIb medical-device software and is ISO 13485 and ISO 27001 certified,
  positioning it as clinical-grade infrastructure used by health systems (including
  the NHS in its UK home market), pharma, and clinical-trials programs. The public
  developer platform documents an OAuth2-style client-credentials Integration API
  and mobile SDKs; API access is gated behind a Huma Workspace account and no public
  HL7 FHIR CapabilityStatement or downloadable OpenAPI is currently published.
