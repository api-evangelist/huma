openapi: 3.2.0
info:
  title: Huma Platform Medications (Deprecated) API
  version: 1.0.0
  description: Huma Platform
servers:
- url: https://workspace-gcp-uk.api.huma.com/api/integration/v1
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Medications (Deprecated)
paths:
  /api/extensions/v1/user/{user_id}/medication/:
    post:
      operationId: api_extensions_v1_user_medication_create_[create_medication]_2
      summary: Create Medication
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      tags:
      - Medications (Deprecated)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicationRequestObjectDRF'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateMedicationRequestObjectDRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateMedicationRequestObjectDRF'
        required: true
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultIdResponseObjectDRF'
          description: ''
  /api/extensions/v1/user/{user_id}/medication/{medication_id}:
    post:
      operationId: api_extensions_v1_user_medication_create_[update_medication_v1]
      summary: Update Medication V1
      parameters:
      - in: path
        name: medication_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      tags:
      - Medications (Deprecated)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequestObjectDRF'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequestObjectDRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequestObjectDRF'
        required: true
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultIdResponseObjectDRF'
          description: ''
    put:
      operationId: api_extensions_v1_user_medication_update_[update_medication]
      summary: Update Medication
      parameters:
      - in: path
        name: medication_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      tags:
      - Medications (Deprecated)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequestObjectV2DRF'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequestObjectV2DRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequestObjectV2DRF'
        required: true
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultIdResponseObjectDRF'
          description: ''
  /api/extensions/v1/user/{user_id}/medication/retrieve:
    post:
      operationId: api_extensions_v1_user_medication_retrieve_create_[retrieve_medications]
