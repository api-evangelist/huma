openapi: 3.2.0
info:
  title: Huma Platform Module Results API
  version: 1.0.0
  description: Huma Platform
servers:
- url: https://workspace-gcp-uk.api.huma.com/api/integration/v1
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Module Results
paths:
  /api/extensions/v1/public-module/{shortcode}:
    get:
      operationId: api_extensions_v1_public_module_retrieve_[retrieve_module_config]
      description: 'Retrieve Module Config

        Retrieve public module configuration by shortcode.'
      summary: Retrieve Module Config
      parameters:
      - in: path
        name: shortcode
        schema:
          type: string
        required: true
      tags:
      - Module Results
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievePublicModuleConfigResponseObjectDRF'
          description: ''
    post:
      operationId: api_extensions_v1_public_module_create_[create_module_result]
      description: 'Submit Module Result

        Create a module result for a public module using the provided shortcode.'
      summary: Create Module Result
      parameters:
      - in: path
        name: shortcode
        schema:
          type: string
        required: true
      tags:
      - Module Results
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicModuleItemRequestBodyDRF'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePublicModuleItemRequestBodyDRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePublicModuleItemRequestBodyDRF'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateModuleResultResponseObjectDRF'
          description: ''
  /api/extensions/v1/user/{user_id}/flagged-modules:
