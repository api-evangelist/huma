          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetrieveBillingMonitoringLogsRequestBodyDRF'
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMonitoringLogsResponseObjectDRF'
          description: ''
