      summary: Create Billing Charges Records
      parameters:
      - in: path
        name: bill_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendChargeToBillRequestObjectDRF'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppendChargeToBillRequestObjectDRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppendChargeToBillRequestObjectDRF'
