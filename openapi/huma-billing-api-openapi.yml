      - in: path
        name: log_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      tags:
      - Billing
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
