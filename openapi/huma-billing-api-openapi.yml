          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      - in: path
        name: charge_id
        schema:
          type: string
          pattern: ^[a-f0-9]{24}$
        required: true
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChargeUnitRecordRequestObjectDRF'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChargeUnitRecordRequestObjectDRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChargeUnitRecordRequestObjectDRF'
