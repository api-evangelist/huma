      summary: Get Client Medical Record
      parameters:
      - in: query
        name: clientId
        schema:
          type: string
      - in: query
        name: reportEndDate
        schema:
          type: string
          format: date-time
      - in: query
        name: yearMonth
        schema:
          type: string
      tags:
      - Billing
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientMedicalRecordResponseObjectDRF'
          description: ''
