  /api/v1/billing-portal/billing/{bill_id}/charge:
    put:
      operationId: api_v1_billing_portal_billing_charge_update_[create_billing_charge_record]
      summary: Create Billing Charge Record
      parameters:
      - in: path
        name: bill_id
        schema:
          type: string
