          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TriggerTaskRequestObjectDRF'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TriggerTaskRequestObjectDRF'
      security:
      - JWT Auth: []
      - Hawk Auth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
